# ============================================================
# docker-compose.yml —— 一键启动生产容器
#   docker-compose up -d 构建并后台运行，映射宿主机 8080 → 容器 80。
#   restart: unless-stopped 容器崩溃/宿主机重启后自动拉起。
# ============================================================
version: "3"
services:
  web:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
