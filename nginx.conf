# ============================================================
# nginx.conf —— 生产静态托管配置
#   try_files：history 路由刷新不 404（必须，否则 /xxx 刷新白屏）
#   gzip_static：直接分发 vue.config 预生成的 .gz 文件
#   /static/：带 hash 的静态资源长缓存
# 上线前改：server_name 为真实域名。
# ============================================================
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip：配合 vue.config 的 CompressionWebpackPlugin 产物直接分发
  gzip_static on;

  # history 路由：刷新不 404（关键）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源缓存
  location /static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
