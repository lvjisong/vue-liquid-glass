server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip：配合 vue.config 的 CompressionWebpackPlugin 产物直接分发
  gzip_static on;

  # history 路由：刷新不 404（关键）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源缓存
  location /static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
